<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Grid background lines -->
  <defs>
    <pattern id="cadGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ececec" stroke-width="0.75" />
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#e0e0e0" stroke-width="1.2" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#cadGrid)" stroke="none" />

  <!-- Outer Boundary Walls (Thick double lines) -->
  <rect x="80" y="60" width="640" height="480" stroke="#000" stroke-width="4" rx="2" fill="none" />
  <rect x="90" y="70" width="620" height="460" stroke="#444" stroke-width="1.5" fill="none" />

  <!-- Main Entrance & Vestibule -->
  <path d="M 360 540 L 360 480 L 440 480 L 440 540" stroke="#000" stroke-width="3" />
  <!-- Swing door arc -->
  <path d="M 370 540 A 60 60 0 0 1 430 480" stroke="#777" stroke-dasharray="4 3" stroke-width="1.5" />
  <line x1="370" y1="540" x2="370" y2="480" stroke="#000" stroke-width="2" />

  <!-- Central Gallery / Atrium -->
  <rect x="280" y="220" width="240" height="200" stroke="#111" stroke-width="2.5" />
  <!-- Skylight / Inner detail -->
  <circle cx="400" cy="320" r="60" stroke="#999" stroke-dasharray="6 4" stroke-width="1.5" />
  <circle cx="400" cy="320" r="30" stroke="#999" stroke-width="1" />
  <line x1="340" y1="320" x2="460" y2="320" stroke="#bbb" stroke-width="1" />
  <line x1="400" y1="260" x2="400" y2="380" stroke="#bbb" stroke-width="1" />

  <!-- West Wing: Living & Lounge -->
  <path d="M 90 220 L 280 220" stroke="#000" stroke-width="3" />
  <path d="M 90 380 L 280 380" stroke="#000" stroke-width="3" />
  <!-- Furniture layout: Curved Sofa -->
  <path d="M 140 260 Q 200 240 220 300 Q 200 360 140 340" stroke="#666" stroke-width="2" fill="#f8f8f8" />
  <circle cx="170" cy="300" r="22" stroke="#444" stroke-width="1.5" fill="#f0f0f0" />

  <!-- North Wing: Master Studio Suite -->
  <path d="M 280 70 L 280 220" stroke="#000" stroke-width="3" />
  <path d="M 520 70 L 520 220" stroke="#000" stroke-width="3" />
  <line x1="340" y1="70" x2="460" y2="70" stroke="#fff" stroke-width="6" /> <!-- Window opening -->
  <line x1="340" y1="70" x2="460" y2="70" stroke="#2563eb" stroke-width="2" />
  <!-- Work table & draft station -->
  <rect x="340" y="110" width="120" height="60" stroke="#444" stroke-width="1.5" fill="#fafafa" rx="4" />
  <rect x="380" y="90" width="40" height="15" stroke="#777" stroke-width="1" rx="2" />
  <rect x="380" y="175" width="40" height="15" stroke="#777" stroke-width="1" rx="2" />

  <!-- East Wing: Design Archive & Dining -->
  <path d="M 520 220 L 710 220" stroke="#000" stroke-width="3" />
  <path d="M 520 380 L 710 380" stroke="#000" stroke-width="3" />
  <!-- Long conference table & chairs -->
  <rect x="560" y="270" width="110" height="60" stroke="#444" stroke-width="2" fill="#f9f9f9" rx="8" />
  <!-- Chairs -->
  <circle cx="580" cy="255" r="8" stroke="#777" stroke-width="1" />
  <circle cx="615" cy="255" r="8" stroke="#777" stroke-width="1" />
  <circle cx="650" cy="255" r="8" stroke="#777" stroke-width="1" />
  <circle cx="580" cy="345" r="8" stroke="#777" stroke-width="1" />
  <circle cx="615" cy="345" r="8" stroke="#777" stroke-width="1" />
  <circle cx="650" cy="345" r="8" stroke="#777" stroke-width="1" />

  <!-- South-West: Terrace & Water Courtyard -->
  <rect x="120" y="410" width="130" height="90" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2" fill="#eff6ff" opacity="0.6" />
  <text x="145" y="460" font-family="'Courier New', monospace" font-size="11" fill="#2563eb" letter-spacing="1">REFLECTING POOL</text>

  <!-- South-East: Outdoor Cantilevered Deck -->
  <path d="M 550 410 L 680 410 L 680 500 L 550 500 Z" stroke="#888" stroke-width="1" stroke-dasharray="6 3" fill="#fafafa" />
  <line x1="550" y1="425" x2="680" y2="425" stroke="#e0e0e0" stroke-width="1" />
  <line x1="550" y1="445" x2="680" y2="445" stroke="#e0e0e0" stroke-width="1" />
  <line x1="550" y1="465" x2="680" y2="465" stroke="#e0e0e0" stroke-width="1" />
  <line x1="550" y1="485" x2="680" y2="485" stroke="#e0e0e0" stroke-width="1" />

  <!-- Architectural Dimension Lines & Annotations -->
  <g stroke="#999" stroke-width="1">
    <!-- Top horizontal dimension -->
    <line x1="80" y1="35" x2="720" y2="35" />
    <line x1="80" y1="25" x2="80" y2="45" />
    <line x1="720" y1="25" x2="720" y2="45" />
    <text x="365" y="30" font-family="'Courier New', monospace" font-size="11" fill="#666" font-weight="600">24,500 MM</text>

    <!-- Left vertical dimension -->
    <line x1="50" y1="60" x2="50" y2="540" />
    <line x1="40" y1="60" x2="60" y2="60" />
    <line x1="40" y1="540" x2="60" y2="540" />
    <text x="18" y="310" font-family="'Courier New', monospace" font-size="11" fill="#666" font-weight="600" transform="rotate(-90 40 310)">18,200 MM</text>
  </g>

  <!-- Architectural Title Block in bottom right -->
  <rect x="510" y="525" width="200" height="45" fill="#fff" stroke="#333" stroke-width="1.5" />
  <text x="520" y="542" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#111" letter-spacing="0.5">LEVEL 01 ARCHITECTURAL PLAN</text>
  <text x="520" y="558" font-family="'Courier New', monospace" font-size="8" fill="#666">SCALE: 1:100  |  REV: 04  |  ATELIER</text>
</svg>
